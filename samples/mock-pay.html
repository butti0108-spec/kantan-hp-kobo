<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お支払い（モック決済）｜アーチデザイン工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26241f; --ink-2:#4a463d; --paper:#f4f1ea; --card:#fbf9f4; --line:#ddd5c3;
  --blue:#0052B5; --blue-deep:#003d87;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink);line-height:1.8;font-size:15.5px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:26px 0 6px}
header .shop{font-family:"Noto Serif JP",serif;font-size:15px;letter-spacing:.14em;color:var(--blue);font-weight:700}
h1{font-family:"Noto Serif JP",serif;font-size:clamp(22px,4.6vw,30px);margin-top:6px}
.proto{display:inline-block;background:#fdf3d8;border:1px solid #e5cf8a;border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:700;margin-top:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px clamp(16px,3vw,26px);margin-top:18px}
.box h2{font-family:"Noto Serif JP",serif;font-size:18px;margin-bottom:8px}
.notice{border:1.5px solid #b3261e;border-radius:10px;padding:12px 16px;margin-top:16px;font-weight:700;background:#fff}
.receipt{background:#fdf3d8;border:1px solid #e5cf8a;border-radius:10px;padding:12px 16px;margin:12px 0;text-align:center}
.receipt .rnum{font-size:26px;font-weight:900;letter-spacing:.08em;margin:2px 0}
.receipt .amount{font-size:22px;font-weight:900;margin:2px 0}
.btn{display:inline-block;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:14px 26px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:14px;text-decoration:none}
.btn:hover{background:var(--blue-deep)}
.btn.sub{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{background:#9a917e;cursor:not-allowed}
.hint{font-size:13px;color:var(--ink-2)}
.err{display:none;color:#b3261e;font-size:13.5px;font-weight:700;margin-top:8px}
footer{margin-top:34px;font-size:13px;color:var(--ink-2);text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="shop">アーチデザイン工房</p>
  <h1>お支払い</h1>
  <p><span class="proto">試作品のモック決済です</span></p>
</header>

<div class="notice">これは試作品のモック決済です。本物のお支払いは発生しません。カード情報などを入力する欄はありません。本番では、この場所にStripeの決済画面が入ります。</div>

<div class="box">
  <h2>お支払いの内容</h2>
  <div class="receipt">
    <p>受付番号</p>
    <p class="rnum" id="dispNum">—</p>
    <p>金額</p>
    <p class="amount">10,000円（税込）</p>
  </div>
  <p class="err" id="noNum">受付番号が確認できませんでした。注文ページに戻って、確定からやり直してください。</p>
  <button type="button" class="btn" id="mockDoneBtn">お支払いを完了する（モック）</button>
  <a class="btn sub" id="backLink" href="index.html">注文ページへ戻る</a>
  <p class="hint" style="margin-top:10px">ボタンを押すと、注文ページの決済完了画面へ進みます。</p>
</div>

<footer>
  <p>アーチデザイン工房</p>
</footer>
</div>

<script>
var q = new URLSearchParams(location.search);
var num = q.get('num') || '';
var from = q.get('from') || '';
if (!/^order-\d{2}\.html$/.test(from)) from = 'index.html';
document.getElementById('backLink').href = from;
var btn = document.getElementById('mockDoneBtn');
if (num){
  document.getElementById('dispNum').textContent = num;
} else {
  document.getElementById('noNum').style.display = 'block';
  btn.disabled = true;
}
btn.addEventListener('click', function(){
  location.href = from + '?paid=' + encodeURIComponent(num);
});
</script>
</body>
</html>
